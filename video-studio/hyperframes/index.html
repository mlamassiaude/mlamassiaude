<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"Video Studio"},{"id":"accent","type":"color","label":"Accent","default":"#ff5a36"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e0f13;
        --ink: #f4f1ea;
        --accent: #ff5a36;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="stack"
        data-composition-id="stack"
        data-composition-src="compositions/stack.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <audio id="pad" src="assets/pad.mp3" data-start="0" data-duration="8" data-track-index="2" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
