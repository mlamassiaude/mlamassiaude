{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash {{ category }} no-print" role="{{ 'alert' if category == 'error' else 'status' }}">{{ icon('alert' if category == 'error' else 'done') }}<span>{{ message }}</span></div>
  {% endfor %}
{% endwith %}
