   Render
   ========================================================= */
const VIEWS = { dashboard: viewDashboard, calendar: viewCalendar, shows: viewShows, artists: viewArtists, contacts: viewContacts, finance: viewFinance, data: viewData };
const TITLES = { dashboard: 'Dashboard', calendar: 'Calendar', shows: 'Shows', artists: 'Artists', contacts: 'Contacts', finance: 'Finance', data: 'Data' };

function renderNav() {
  const t = today();
  const counts = {
    shows: db.events.filter(e => inFilter(e) && e.date >= t && live(e)).length,
    artists: db.artists.length,
    contacts: db.contacts.length,
    finance: db.invoices.filter(i => invStatus(i) === 'overdue').length || '',
  };
  document.getElementById('nav').innerHTML = ROUTES.map(r => `<a href="#${r.id}" ${ui.route === r.id ? 'aria-current="page"' : ''}>${svg(r.id)}<span>${r.label}</span>${counts[r.id] !== undefined && counts[r.id] !== '' ? `<span class="count">${counts[r.id]}</span>` : ''}</a>`).join('');
  const sel = document.getElementById('artist-filter');
  sel.innerHTML = `<option value="all">All artists</option>` + db.artists.map(a => `<option value="${a.id}" ${prefs.artist === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
  sel.value = artistById(prefs.artist) ? prefs.artist : 'all';
  sel.hidden = ['artists', 'contacts', 'data'].includes(ui.route);
  document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === prefs.theme)));
}

function render() {
  const active = document.activeElement;
  const keepId = active && active.id && ['show-search', 'contact-search'].includes(active.id) ? active.id : null;
  const caret = keepId ? active.selectionStart : null;
  renderNav();
  document.getElementById('page-title').innerHTML = esc(TITLES[ui.route]) + (db.demo && ui.route === 'dashboard' ? ' <span class="demo-flag">Demo data</span>' : '');
  document.getElementById('view').innerHTML = VIEWS[ui.route]();
  document.getElementById('overlay').innerHTML = renderDrawer() + renderModal();
  if (keepId) { const el = document.getElementById(keepId); el.focus(); try { el.setSelectionRange(caret, caret); } catch { /* search inputs */ } }
}

function applyTheme() {
  const r = document.documentElement;
  if (prefs.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', prefs.theme);
}

function go(route) {
  if (location.hash.slice(1) !== route) location.hash = route;
  else { ui.route = route; render(); }
}
function syncRoute() {
  const r = location.hash.slice(1);
  ui.route = VIEWS[r] ? r : 'dashboard';
  document.getElementById('app').classList.remove('nav-open');
  render();
  window.scrollTo(0, 0);
}

function toast(msg) {
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function copyText(text, label) {
  const done = () => toast(`${label} copied.`);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => selectFallback());
  } else selectFallback();
  function selectFallback() { toast('Copy blocked here. The text is selected, press Ctrl/Cmd+C.'); }
}

/* =========================================================
   Actions
   ========================================================= */
const touchDemo = () => { if (db.demo) { db.demo = false; } };
const ACTIONS = {
  menu() { document.getElementById('app').classList.toggle('nav-open'); },
  theme(el) { prefs.theme = el.dataset.v; savePrefs(); applyTheme(); renderNav(); },
  'new-event'(el, e) { if (e.target.closest('.chip')) return; eventForm(null, el.dataset.date); },
  'open-event'(el, e) { e.preventDefault(); e.stopPropagation(); if (!eventById(el.dataset.id)) return; ui.drawer = el.dataset.id; ui.drawerTab = el.dataset.tab || 'deal'; render(); },
  'close-drawer'() { ui.drawer = null; render(); },
  tab(el) { ui.drawerTab = el.dataset.v; render(); },
  'set-status'(el) {
    const ev = eventById(ui.drawer); const v = el.dataset.v;
    if (ev.status === v) return;
    ev.status = v;
    if (v === 'option' && !ev.optionExpires) ev.optionExpires = iso(addDays(new Date(), 14));
    if (v !== 'option') ev.optionExpires = '';
    touchDemo(); save(); render(); toast(`Marked ${STATUS_LABEL[v].toLowerCase()}.`);
  },
  'edit-event'(el) { eventForm(eventById(el.dataset.id)); },
  'dup-event'(el) {
    const src = eventById(el.dataset.id);
    const copy = { ...JSON.parse(JSON.stringify(src)), id: uid(), status: 'option', date: iso(addDays(parse(src.date), 7)), optionExpires: iso(addDays(new Date(), 14)), contract: 'none', created: today() };
    db.events.push(copy); ui.drawer = copy.id; ui.drawerTab = 'deal';
    touchDemo(); save(); render(); toast(`Duplicated as an option on ${fmtShort(copy.date)}.`);
  },
  'del-event'(el) {
    const id = el.dataset.id;
    db.events = db.events.filter(e => e.id !== id);
    db.invoices = db.invoices.filter(i => i.eventId !== id);
    ui.drawer = null; touchDemo(); save(); render(); toast('Show deleted.');
  },
  'cal-move'(el) { ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + Number(el.dataset.n), 1); render(); },
  'cal-today'() { const d = new Date(); ui.month = new Date(d.getFullYear(), d.getMonth(), 1); render(); },
  'ev-filter'(el) { prefs.evStatus = el.dataset.v; savePrefs(); render(); },
  'inv-filter'(el) { ui.invStatus = el.dataset.v; render(); },
  'inv-set'(el) {
    const i = db.invoices.find(x => x.id === el.dataset.id); i.status = el.dataset.v;
    if (el.dataset.v === 'sent' && i.issued > today()) i.issued = today();
    touchDemo(); save(); render(); toast(`${i.number} marked ${el.dataset.v}.`);
  },
  'inv-del'(el) { db.invoices = db.invoices.filter(x => x.id !== el.dataset.id); touchDemo(); save(); render(); toast('Invoice deleted.'); },
  'inv-gen'(el) {
    const ev = eventById(ui.drawer); const kind = el.dataset.kind;
    const already = db.invoices.filter(i => i.eventId === ev.id).reduce((s, i) => s + Number(i.amount), 0);
    const amount = kind === 'Deposit' ? Math.round(ev.fee * ev.depositPct / 100) : Math.max(0, ev.fee - already);
    const due = kind === 'Deposit' ? iso(addDays(new Date(), 14)) : (ev.date < today() ? iso(addDays(new Date(), 7)) : ev.date);
    const inv = { id: uid(), number: nextInvoiceNumber(), eventId: ev.id, kind, amount, currency: ev.currency, issued: today(), due, status: 'draft' };
    db.invoices.push(inv); touchDemo(); save(); render(); toast(`Draft ${inv.number} created.`);
  },
  'sched-add'() { const ev = eventById(ui.drawer); ev.schedule.push({ time: '', label: '' }); save(); render(); const ins = document.querySelectorAll('.sched input[data-k="time"]'); ins[ins.length - 1]?.focus(); },
  'sched-del'(el) { const ev = eventById(ui.drawer); ev.schedule.splice(Number(el.dataset.i), 1); save(); render(); },
  'sched-tpl'(el) {
    const ev = eventById(ui.drawer);
    const tpl = el.dataset.v === 'club'
      ? [{ time: '21:00', label: 'Venue access' }, { time: '23:00', label: 'Doors' }, { time: '02:00', label: 'Set start' }, { time: '04:00', label: 'Set end' }]
      : [{ time: '15:00', label: 'Load-in' }, { time: '17:00', label: 'Soundcheck' }, { time: '19:30', label: 'Doors' }, { time: '21:00', label: 'Headline set' }, { time: '23:00', label: 'Curfew' }];
    ev.schedule = tpl; touchDemo(); save(); render();
  },
  'new-artist'() { artistForm(null); },
  'edit-artist'(el) { artistForm(artistById(el.dataset.id)); },
  'new-contact'() { contactForm(null); },
  'edit-contact'(el) { contactForm(contactById(el.dataset.id)); },
  'close-modal'(el, e) { if (el.dataset.self && e.target !== el) return; ui.modal = null; render(); },
  'modal-delete'() {
    const err = ui.modal.onDelete();
    if (typeof err === 'string') { const box = document.getElementById('form-error'); box.textContent = err; box.hidden = false; return; }
    ui.modal = null; touchDemo(); render();
  },
  copy(el) { const t = document.getElementById(el.dataset.target); t.select(); copyText(t.value, el.dataset.target === 'daysheet' ? 'Day sheet' : 'JSON'); },
  'download-json'() {
    try {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `gigbook-backup-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch { toast('Download blocked here. Use Copy JSON instead.'); }
  },
  'export-csv'() {
    const cols = ['date', 'artist', 'status', 'title', 'venue', 'city', 'country', 'promoter', 'dealType', 'fee', 'currency', 'commissionPct', 'contract'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = db.events.slice().sort(byDate).map(e => [e.date, artistById(e.artistId)?.name, e.status, e.title, e.venue, e.city, e.country, contactById(e.promoterId)?.company, e.dealType, e.fee, e.currency, e.commissionPct, e.contract].map(q).join(','));
    const csv = [cols.join(','), ...rows].join('\n');
    const ta = document.getElementById('export-json'); ta.value = csv; ta.select();
    copyText(csv, 'CSV');
  },
  import() { importText(document.getElementById('import-json').value); },
  'reset-demo'() { db = seed(); save(); ui.drawer = null; render(); toast('Demo data reloaded.'); },
  wipe() { db = { version: 1, demo: false, artists: [], contacts: [], events: [], invoices: [] }; save(); ui.drawer = null; prefs.artist = 'all'; savePrefs(); render(); toast('All data cleared. Start by adding an artist.'); },
};

function importText(text) {
  try {
    const d = JSON.parse(text);
    if (!d || !Array.isArray(d.events) || !Array.isArray(d.artists)) throw new Error('shape');
    db = { version: 1, demo: false, artists: d.artists, contacts: d.contacts || [], events: d.events.map(e => ({ schedule: [], hotel: '', travel: '', notes: '', contract: 'none', ...e })), invoices: d.invoices || [] };
    save(); render(); toast(`Restored ${db.events.length} shows and ${db.artists.length} artists.`);
  } catch {
    toast('That is not a Gigbook backup. It needs "artists" and "events" lists.');
  }
}

/* two-step confirmation (dialogs are not available everywhere) */
function armed(el) {
  if (!el.dataset.confirm) return true;
  if (el.dataset.armed === '1') return true;
  el.dataset.armed = '1';
  el.dataset.label = el.textContent;
  el.textContent = el.dataset.confirm;
  setTimeout(() => { if (el.isConnected) { el.dataset.armed = ''; el.textContent = el.dataset.label; } }, 3500);
  return false;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (document.getElementById('app').classList.contains('nav-open') && !e.target.closest('.rail')) document.getElementById('app').classList.remove('nav-open');
    return;
  }
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (!armed(el)) return;
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (ui.modal) { ui.modal = null; render(); }
    else if (ui.drawer) { ui.drawer = null; render(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[tabindex="0"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'modal-form') return;
  e.preventDefault();
  const values = Object.fromEntries(new FormData(e.target).entries());
  const err = ui.modal.onSave(values);
  if (typeof err === 'string') { const box = document.getElementById('form-error'); box.textContent = err; box.hidden = false; return; }
  ui.modal = null; touchDemo(); save(); render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'show-search') { ui.q = t.value; render(); }
  else if (t.id === 'contact-search') { ui.contactQ = t.value; render(); }
  else if (t.closest('#modal-form')) {
    updateConflict();
    // when the artist changes on a new show, pull in their default fee and commission
    if (t.name === 'artistId' && !ui.modal.values.id) {
      const a = artistById(t.value); const f = t.form;
      if (a) { f.elements.fee.value = a.fee; f.elements.currency.value = a.currency; f.elements.commissionPct.value = a.commission; }
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'artist-filter') { prefs.artist = t.value; savePrefs(); render(); }
  else if (t.id === 'contact-role') { ui.contactRole = t.value; render(); }
  else if (t.dataset.sched != null) {
    const ev = eventById(ui.drawer); ev.schedule[Number(t.dataset.sched)][t.dataset.k] = t.value;
    touchDemo(); save(); render();
  } else if (t.dataset.evfield) {
    const ev = eventById(ui.drawer); ev[t.dataset.evfield] = t.value; touchDemo(); save(); render();
  } else if (t.id === 'import-file' && t.files[0]) {
    const r = new FileReader(); r.onload = () => importText(String(r.result)); r.readAsText(t.files[0]);
    t.value = '';
  }
});

/* chart tooltip */
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  tip.innerHTML = el.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth;
  tip.style.left = `${Math.min(window.innerWidth - w - 8, e.clientX + 14)}px`;
  tip.style.top = `${e.clientY + 14}px`;
});

window.addEventListener('hashchange', syncRoute);
applyTheme();
syncRoute();
})();
</script>
</body>
