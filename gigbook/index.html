<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gigbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail with nav, main work area with a sticky toolbar; event detail opens in a right-hand drawer, forms in a centred sheet. */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --surface-2: #E9EBF2;
  --line: #D8DBE6;
  --fg: #151929;
  --muted: #5D6378;
  --accent: #3140D4;
  --accent-fg: #FFFFFF;
  --accent-soft: #E2E5FC;
  --accent-tint: #A9B1F2;

  --option: #A86605;   --option-bg: #FBEFD8;
  --pending: #2463A8;  --pending-bg: #DFEAF8;
  --confirmed: #1B7D52; --confirmed-bg: #DAF1E5;
  --cancelled: #7D8294; --cancelled-bg: #EBECF0;
  --danger: #B9302A;   --danger-bg: #FBE2E0;

  --shadow: 0 1px 2px rgb(21 25 41 / .06), 0 8px 24px rgb(21 25 41 / .08);
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
  --rail: 232px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1119; --surface: #171A26; --surface-2: #212536; --line: #2D3246;
    --fg: #E7E9F2; --muted: #979DB3; --accent: #8390FF; --accent-fg: #0D1020; --accent-soft: #252A52; --accent-tint: #3D4687;
    --option: #F0B24A; --option-bg: #38290F; --pending: #7DB1EE; --pending-bg: #172A42;
    --confirmed: #5DCB94; --confirmed-bg: #13302A; --cancelled: #8E93A6; --cancelled-bg: #252836;
    --danger: #F27A72; --danger-bg: #3C1C1B;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1119; --surface: #171A26; --surface-2: #212536; --line: #2D3246;
  --fg: #E7E9F2; --muted: #979DB3; --accent: #8390FF; --accent-fg: #0D1020; --accent-soft: #252A52; --accent-tint: #3D4687;
  --option: #F0B24A; --option-bg: #38290F; --pending: #7DB1EE; --pending-bg: #172A42;
  --confirmed: #5DCB94; --confirmed-bg: #13302A; --cancelled: #8E93A6; --cancelled-bg: #252836;
  --danger: #F27A72; --danger-bg: #3C1C1B;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 14px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, td.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 24px;
  padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 7px; background: var(--fg); color: var(--bg);
  display: grid; place-items: center; font: 800 15px/1 var(--font-display); font-stretch: 75%;
}
.brand-name { font: 800 22px/1 var(--font-display); font-stretch: 72%; letter-spacing: .01em; text-transform: uppercase; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px;
  color: var(--muted); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--fg); }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav .count { margin-left: auto; font: 500 11px/1 var(--font-mono); color: var(--muted); }
.rail-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.theme-switch { display: flex; gap: 4px; }
.theme-switch button { flex: 1; padding: 4px 0; border: 1px solid var(--line); background: transparent; border-radius: 5px; font-size: 11px; cursor: pointer; color: var(--muted); }
.theme-switch button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }

.main { min-width: 0; display: flex; flex-direction: column; }
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  padding: 14px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.toolbar h1 { margin: 0; font: 800 26px/1.1 var(--font-display); font-stretch: 75%; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.toolbar .spacer { flex: 1; }
.content { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--danger); }
.btn.danger[data-armed="1"] { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; }
.field, select.field, input.field, textarea.field {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0;
}
.field:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 500; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- status pills ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 7px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .02em; white-space: nowrap;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.option { color: var(--option); background: var(--option-bg); }
.pill.pending { color: var(--pending); background: var(--pending-bg); }
.pill.confirmed { color: var(--confirmed); background: var(--confirmed-bg); }
.pill.cancelled { color: var(--cancelled); background: var(--cancelled-bg); text-decoration: line-through; }
.pill.draft { color: var(--muted); background: var(--surface-2); }
.pill.sent { color: var(--pending); background: var(--pending-bg); }
.pill.paid { color: var(--confirmed); background: var(--confirmed-bg); }
.pill.overdue { color: var(--danger); background: var(--danger-bg); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 10px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font: 700 13px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .08em; }
.panel-head .sub { color: var(--muted); font-size: 12px; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 0 16px 16px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* ---------- KPI row ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .label { font-size: 12px; color: var(--muted); }
.kpi .value { font: 600 26px/1.15 var(--font-body); font-variant-numeric: tabular-nums; }
.kpi .note { font-size: 12px; color: var(--muted); }
.kpi .note.warn { color: var(--danger); }

/* ---------- lists ---------- */
.gig-list { list-style: none; margin: 0; padding: 0; }
.gig {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer;
}
.gig:hover { background: var(--surface-2); }
.datebox { text-align: center; line-height: 1; border: 1px solid var(--line); border-radius: 6px; padding: 5px 0 6px; background: var(--surface); }
.datebox .m { font: 600 10px/1 var(--font-body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.datebox .d { font: 800 21px/1.05 var(--font-display); font-stretch: 80%; }
.gig .who { font-weight: 600; display: flex; align-items: center; gap: 7px; min-width: 0; }
.gig .who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gig .where { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gig .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.gig .fee { font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.todo li:hover { background: var(--surface-2); }
.todo .ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 700 12px/1 var(--font-mono); }
.todo .ico.warn { background: var(--option-bg); color: var(--option); }
.todo .ico.crit { background: var(--danger-bg); color: var(--danger); }
.todo .ico.info { background: var(--pending-bg); color: var(--pending); }
.todo .t { font-weight: 500; }
.todo .s { font-size: 12.5px; color: var(--muted); }
.todo .when { font: 500 12px/1.6 var(--font-mono); color: var(--muted); white-space: nowrap; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
th.num, td.num { text-align: right; white-space: nowrap; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
tfoot td { font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; }

/* ---------- chart ---------- */
.chart { position: relative; padding: 22px 16px 12px; }
.chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); padding: 0 16px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.bars { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); height: 180px; margin-left: 46px; border-bottom: 1px solid var(--line); }
.bars .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--surface-2); }
.bars .tick { position: absolute; left: -46px; width: 40px; text-align: right; transform: translateY(-50%); font: 400 11px/1 var(--font-mono); color: var(--muted); }
.bar-slot { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: default; }
.bar-stack { width: min(24px, 60%); display: flex; flex-direction: column-reverse; gap: 2px; }
.bar-stack .seg-c { background: var(--accent); }
.bar-stack .seg-h { background: var(--accent-tint); }
.bar-stack > div:last-child { border-radius: 4px 4px 0 0; }
.bar-slot:hover .bar-stack { filter: brightness(1.1); }
.bar-labels { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-left: 46px; padding-top: 6px; font-size: 11.5px; color: var(--muted); text-align: center; }
.bar-val { position: absolute; font: 500 11px/1 var(--font-mono); color: var(--fg); transform: translateY(-16px); white-space: nowrap; }
.tooltip { position: fixed; z-index: 60; pointer-events: none; background: var(--fg); color: var(--bg); padding: 7px 10px; border-radius: 6px; font-size: 12px; box-shadow: var(--shadow); }
.tooltip b { display: block; margin-bottom: 2px; }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-title { font: 800 22px/1 var(--font-display); font-stretch: 75%; text-transform: uppercase; min-width: 170px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.cal .dow { padding: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cal .day { min-height: 112px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
.cal .day:hover { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
.cal .day.out { background: var(--bg); color: var(--muted); }
.cal .day .n { font: 500 12px/1 var(--font-mono); color: var(--muted); padding: 2px 2px 4px; }
.cal .day.today .n { color: var(--accent-fg); background: var(--accent); border-radius: 4px; align-self: flex-start; padding: 3px 5px; }
.cal .chip {
  display: flex; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 4px; font-size: 11.5px; line-height: 1.25;
  border: 0; text-align: left; cursor: pointer; min-width: 0; width: 100%;
}
.cal .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .chip.option { background: var(--option-bg); color: var(--fg); outline: 1px dashed var(--option); outline-offset: -1px; }
.cal .chip.pending { background: var(--pending-bg); color: var(--fg); }
.cal .chip.confirmed { background: var(--confirmed-bg); color: var(--fg); }
.cal .chip.cancelled { background: var(--cancelled-bg); color: var(--muted); text-decoration: line-through; }
.legend-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- artists ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.artist-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; min-width: 0; }
.artist-card:hover { border-color: var(--muted); }
.artist-card .top { display: flex; gap: 12px; align-items: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 800 16px/1 var(--font-display); font-stretch: 80%; flex: none; }
.artist-card h3 { margin: 0; font: 800 20px/1.1 var(--font-display); font-stretch: 78%; text-transform: uppercase; }
.artist-card .meta { font-size: 12.5px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stats .v { font: 500 14px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.next { font-size: 12.5px; color: var(--muted); }
.next b { color: var(--fg); font-weight: 500; }

/* ---------- drawer & modal ---------- */
.scrim { position: fixed; inset: 0; background: rgb(10 12 20 / .45); z-index: 30; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 31;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .18s ease-out; }
  .sheet { animation: rise .16s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } }
  @keyframes rise { from { transform: translateY(10px); opacity: .6; } }
}
.drawer-head { padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.drawer-head .row { display: flex; align-items: flex-start; gap: 10px; }
.drawer-head h2 { margin: 0; font: 800 26px/1.05 var(--font-display); font-stretch: 75%; text-transform: uppercase; text-wrap: balance; flex: 1; min-width: 0; }
.drawer-head .line2 { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.status-flow { display: flex; gap: 6px; flex-wrap: wrap; }
.status-flow button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.status-flow button[aria-pressed="true"].option { background: var(--option-bg); color: var(--option); border-color: var(--option); }
.status-flow button[aria-pressed="true"].pending { background: var(--pending-bg); color: var(--pending); border-color: var(--pending); }
.status-flow button[aria-pressed="true"].confirmed { background: var(--confirmed-bg); color: var(--confirmed); border-color: var(--confirmed); }
.status-flow button[aria-pressed="true"].cancelled { background: var(--cancelled-bg); color: var(--cancelled); border-color: var(--cancelled); }
.tabs { display: flex; gap: 2px; margin-bottom: -1px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 9px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.drawer-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.dl dt { color: var(--muted); font-size: 13px; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.section-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.money-box { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.money-box div { background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.money-box .k { font-size: 11.5px; color: var(--muted); }
.money-box .v { font: 500 15px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.sched { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.sched li { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-top: 1px solid var(--line); }
.sched li:first-child { border-top: 0; }
.sched input { border: 1px solid transparent; background: transparent; padding: 5px 6px; border-radius: 5px; width: 100%; min-width: 0; }
.sched input:hover { border-color: var(--line); }
.sched input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.sched input[type="time"] { font-family: var(--font-mono); }
.daysheet-text { width: 100%; min-height: 220px; font: 12.5px/1.55 var(--font-mono); padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); resize: vertical; }
.warnbox { padding: 9px 12px; border-radius: 6px; background: var(--danger-bg); color: var(--danger); font-size: 13px; }
.infobox { padding: 9px 12px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-size: 13px; }

.sheet-wrap { position: fixed; inset: 0; z-index: 41; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.sheet { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.sheet-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { margin: 0; flex: 1; font: 800 22px/1.1 var(--font-display); font-stretch: 75%; text-transform: uppercase; }
.sheet-body { padding: 18px 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.sheet-body label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
.sheet-body label.span2, .sheet-body .span2 { grid-column: 1 / -1; }
.sheet-body textarea { min-height: 80px; resize: vertical; }
.sheet-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sheet-foot .left { margin-right: auto; }

.toast-host { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); }

.demo-flag { font-size: 11px; color: var(--option); background: var(--option-bg); padding: 2px 8px; border-radius: 999px; font-weight: 600; }

/* ---------- responsive ---------- */
.menu-btn { display: none; }
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed; z-index: 35; left: 0; top: 0; bottom: 0; height: auto; width: 260px;
    transform: translateX(-100%); transition: transform .18s ease-out; box-shadow: var(--shadow);
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
  }
  .app.nav-open .rail { transform: none; }
  .menu-btn { display: inline-flex; }
  .toolbar { padding: 12px 16px; flex-wrap: nowrap; gap: 8px; }
  .toolbar h1 { font-size: 20px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar .demo-flag { display: none; }
  #artist-filter { max-width: 34vw; }
  .content { padding: 16px 16px 40px; }
  .cal .day { min-height: 70px; padding: 4px; }
  .cal .chip { padding: 0; height: 6px; border-radius: 3px; }
  .cal .chip .dot, .cal .chip span { display: none; }
  .cal .dow { padding: 6px 4px; font-size: 10px; letter-spacing: .02em; }
  .sheet-body { grid-template-columns: minmax(0, 1fr); }
  .dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .dl dd { margin-bottom: 8px; }
  .money-box { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none; }
}
@media (max-width: 480px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpi .value { font-size: 22px; }
  .toolbar .btn-label { display: none; }
}
@media print {
  .rail, .toolbar, .scrim, .drawer-foot, .tabs, .toast-host { display: none !important; }
  .drawer { position: static; width: auto; box-shadow: none; border: 0; }
}

<body>
<div class="app" id="app">
  <aside class="rail" id="rail">
    <div class="brand">

</div>
<div id="overlay"></div>
<div class="toast-host" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tip" hidden></div>

<script>
(() => {
'use strict';

/* =========================================================
   Constants & helpers
   ========================================================= */
const STORE_KEY = 'gigbook.v1';
const PREF_KEY = 'gigbook.prefs';
const FX = { EUR: 1, GBP: 1.17, USD: 0.92, CHF: 1.05, DKK: 0.134 };
const CURRENCIES = Object.keys(FX);
const STATUSES = ['option', 'pending', 'confirmed', 'cancelled'];
const STATUS_LABEL = { option: 'Option', pending: 'Pending', confirmed: 'Confirmed', cancelled: 'Cancelled' };
const DEAL_TYPES = ['Flat fee', 'Versus deal', 'Door split', 'Guarantee + bonus'];
const CONTRACT = { none: 'Not drafted', sent: 'Sent to promoter', signed: 'Signed' };
const ROLES = ['Promoter', 'Venue', 'Festival', 'Tour manager', 'Production', 'Label'];
const ARTIST_COLORS = ['#D9480F', '#7048E8', '#0C8599', '#C2255C', '#2F9E44', '#E8590C', '#1971C2', '#9C36B5'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => iso(new Date());
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toEUR = (amount, cur) => (Number(amount) || 0) * (FX[cur] || 1);
const fmtMoney = (n, cur = 'EUR') => {
  try { return new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(n || 0); }
  catch { return `${cur} ${Math.round(n || 0)}`; }
};
const fmtCompact = n => n >= 1e6 ? `€${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `€${(n / 1e3).toFixed(n >= 1e4 ? 0 : 1)}k` : `€${Math.round(n)}`;
const fmtDate = s => { const d = parse(s); return `${DOW[(d.getDay() + 6) % 7]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const initials = name => name.split(/\s+/).filter(w => /^[A-Za-z0-9]/.test(w) && w.toLowerCase() !== 'the').slice(0, 2).map(w => w[0]).join('').toUpperCase();
const relDays = n => n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? `in ${n} days` : `${-n} days ago`;

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

/* =========================================================
   Demo data (dates are relative to today so it always looks live)
   ========================================================= */
function seed() {
  const t = new Date();
  const D = n => iso(addDays(t, n));
  const artists = [

    { id: 'a2', name: 'The Velvet Static', genre: 'Indie rock, 4-piece', base: 'Manchester, UK', color: ARTIST_COLORS[1], commission: 12, fee: 3200, currency: 'GBP', notes: 'Travel party of 6 incl. TM. Splitter van.' },
    { id: 'a3', name: 'Mira Solé', genre: 'Live electronic', base: 'Lisbon, PT', color: ARTIST_COLORS[2], commission: 15, fee: 6000, currency: 'EUR', notes: 'A/V show needs projector + 6m screen.' },
    { id: 'a4', name: 'Kasper Holm Trio', genre: 'Jazz trio', base: 'Copenhagen, DK', color: ARTIST_COLORS[3], commission: 10, fee: 2800, currency: 'EUR', notes: 'Needs tuned grand or upright piano.' },
  ];
  const contacts = [
    { id: 'c1', name: 'Jonas Brandt', company: 'Halle 9', role: 'Promoter', email: 'jonas@halle9.example', phone: '+49 30 5550 1192', city: 'Berlin', country: 'DE', notes: '' },
    { id: 'c2', name: 'Aoife Gallagher', company: 'Northern Drift Festival', role: 'Festival', email: 'aoife@northerndrift.example', phone: '+353 1 555 0144', city: 'Dublin', country: 'IE', notes: 'Advances 6 weeks out.' },
    { id: 'c3', name: 'Pedro Matias', company: 'Sala Clamor', role: 'Venue', email: 'pedro@salaclamor.example', phone: '+351 22 555 0187', city: 'Porto', country: 'PT', notes: '' },
    { id: 'c4', name: 'Sophie Laurent', company: 'Kantine Nord', role: 'Promoter', email: 'sophie@kantinenord.example', phone: '+49 40 5550 7721', city: 'Hamburg', country: 'DE', notes: '' },
    { id: 'c5', name: 'Tom Reeves', company: 'The Lantern Rooms', role: 'Venue', email: 'tom@lanternrooms.example', phone: '+44 113 555 0199', city: 'Leeds', country: 'UK', notes: 'Curfew 23:00 strict.' },
    { id: 'c6', name: 'Nadia Haddad', company: 'Freelance', role: 'Tour manager', email: 'nadia.tm@mail.example', phone: '+44 7700 900461', city: 'London', country: 'UK', notes: 'TM for The Velvet Static.' },
    { id: 'c7', name: 'Elif Yılmaz', company: 'Bosphorus Sound', role: 'Promoter', email: 'elif@bosphorussound.example', phone: '+90 212 555 0133', city: 'Istanbul', country: 'TR', notes: '' },
    { id: 'c8', name: 'Lukas Meier', company: 'Werkhalle', role: 'Promoter', email: 'lukas@werkhalle.example', phone: '+41 44 555 0108', city: 'Zurich', country: 'CH', notes: '' },
  ];
  const club = [{ time: '21:00', label: 'Venue access' }, { time: '23:00', label: 'Doors' }, { time: '02:00', label: 'Set start (2h)' }, { time: '04:00', label: 'Set end' }];
  const band = [{ time: '15:00', label: 'Load-in' }, { time: '17:00', label: 'Soundcheck' }, { time: '19:30', label: 'Doors' }, { time: '20:15', label: 'Support' }, { time: '21:15', label: 'Headline set (75 min)' }, { time: '23:00', label: 'Curfew' }];
  const E = (id, artistId, off, status, title, venue, city, country, promoterId, fee, currency, extra = {}) => ({
    id, artistId, date: D(off), status, title, venue, city, country, promoterId, fee, currency,
    capacity: extra.capacity || 600, dealType: extra.dealType || 'Flat fee', depositPct: extra.depositPct ?? 50,
    commissionPct: artists.find(a => a.id === artistId).commission,
    optionExpires: status === 'option' ? D(extra.expires ?? off - 30) : '',
    contract: extra.contract || (status === 'confirmed' ? 'signed' : 'none'),
    schedule: extra.schedule || [], hotel: extra.hotel || '', travel: extra.travel || '', notes: extra.notes || '',
    created: D(-60),
  });
  const events = [
    E('e1', 'a1', -38, 'confirmed', 'Halle 9 Saturdays', 'Halle 9', 'Berlin', 'DE', 'c1', 4500, 'EUR', { capacity: 1200, schedule: club, hotel: 'Hotel Spree Ufer, 2 nights, 1 room', travel: 'Local' }),
    E('e2', 'a2', -24, 'confirmed', 'Spring tour', 'The Lantern Rooms', 'Leeds', 'UK', 'c5', 2800, 'GBP', { capacity: 450, schedule: band, dealType: 'Versus deal', notes: '£2,800 vs 80% of net door after costs.' }),
    E('e3', 'a3', -10, 'confirmed', 'Clamor Live', 'Sala Clamor', 'Porto', 'PT', 'c3', 6000, 'EUR', { capacity: 900, schedule: band, travel: 'Train LIS > OPO 10:09, arr. 12:58' }),
    E('e4', 'a1', 3, 'confirmed', 'Kantine Nord Nacht', 'Kantine Nord', 'Hamburg', 'DE', 'c4', 4000, 'EUR', { capacity: 800, schedule: club, hotel: 'Elbblick Hotel, 1 night', travel: 'ICE BER > HAM 17:34, arr. 19:20' }),
    E('e5', 'a2', 9, 'confirmed', 'Autumn tour', 'Werkhalle', 'Zurich', 'CH', 'c8', 4200, 'CHF', { capacity: 700, schedule: band, contract: 'sent', hotel: 'Hotel Limmat, 3 rooms' }),
    E('e6', 'a4', 12, 'pending', 'Jazz Nights', 'Kantine Nord', 'Hamburg', 'DE', 'c4', 2600, 'EUR', { capacity: 300, notes: 'Waiting on promoter to confirm piano hire.' }),
    E('e7', 'a3', 18, 'option', 'Northern Drift Festival', 'Main stage', 'Dublin', 'IE', 'c2', 9500, 'EUR', { capacity: 8000, expires: 2, dealType: 'Guarantee + bonus', notes: 'Bonus €1,500 if sold out. First hold.' }),
    E('e8', 'a1', 24, 'option', 'Bosphorus Sound Opening', 'Depo', 'Istanbul', 'TR', 'c7', 5500, 'EUR', { capacity: 1500, expires: 6 }),
    E('e9', 'a2', 31, 'confirmed', 'Autumn tour', 'Halle 9', 'Berlin', 'DE', 'c1', 3500, 'EUR', { capacity: 1000, contract: 'signed' }),
    E('e10', 'a4', 38, 'confirmed', 'Clamor Jazz Series', 'Sala Clamor', 'Porto', 'PT', 'c3', 2800, 'EUR', { capacity: 350 }),
    E('e11', 'a3', 45, 'pending', 'Werkhalle A/V Night', 'Werkhalle', 'Zurich', 'CH', 'c8', 7000, 'CHF', { capacity: 900 }),
    E('e12', 'a1', 52, 'confirmed', 'Halle 9 Saturdays', 'Halle 9', 'Berlin', 'DE', 'c1', 5000, 'EUR', { capacity: 1200, contract: 'none' }),
    E('e13', 'a2', 60, 'option', 'Northern Drift Club Stage', 'Club tent', 'Dublin', 'IE', 'c2', 3000, 'GBP', { expires: 20 }),
    E('e14', 'a4', 74, 'option', 'Lantern Late', 'The Lantern Rooms', 'Leeds', 'UK', 'c5', 2200, 'GBP', { expires: 28 }),
    E('e15', 'a3', 88, 'confirmed', 'Kantine Nord Live', 'Kantine Nord', 'Hamburg', 'DE', 'c4', 6500, 'EUR', { contract: 'sent' }),
    E('e16', 'a1', 110, 'pending', 'Werkhalle Closing', 'Werkhalle', 'Zurich', 'CH', 'c8', 6000, 'CHF'),
    E('e17', 'a2', 16, 'cancelled', 'Autumn tour', 'Sala Clamor', 'Porto', 'PT', 'c3', 2500, 'EUR', { notes: 'Cancelled by promoter: venue flood. Deposit refunded.' }),
  ];
  const yr = t.getFullYear();
  let n = 0;
  const I = (eventId, kind, pct, issued, due, status) => {
    const ev = events.find(e => e.id === eventId);
    n += 1;
    return { id: uid(), number: `GB-${yr}-${String(n).padStart(3, '0')}`, eventId, kind, amount: Math.round(ev.fee * pct / 100), currency: ev.currency, issued: D(issued), due: D(due), status };
  };
  const invoices = [
    I('e1', 'Deposit', 50, -90, -60, 'paid'), I('e1', 'Balance', 50, -38, -31, 'paid'),
    I('e2', 'Deposit', 50, -70, -40, 'paid'), I('e2', 'Balance', 50, -24, -17, 'paid'),
    I('e3', 'Deposit', 50, -55, -25, 'paid'), I('e3', 'Balance', 50, -10, -3, 'sent'),
    I('e4', 'Deposit', 50, -40, -10, 'paid'), I('e4', 'Balance', 50, 0, 10, 'draft'),
    I('e5', 'Deposit', 50, -30, -2, 'sent'),
    I('e9', 'Deposit', 50, -14, 14, 'sent'),
    I('e10', 'Deposit', 50, -5, 25, 'draft'),
  ];
  return { version: 1, demo: true, artists, contacts, events, invoices };
}

/* =========================================================
   State
   ========================================================= */
let db = store.get(STORE_KEY);
if (!db || !Array.isArray(db.events)) db = seed();
const prefs = Object.assign({ artist: 'all', theme: 'system', evStatus: 'upcoming', calView: 'month' }, store.get(PREF_KEY) || {});
const ui = {
  route: 'dashboard',
  month: (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
  q: '', contactQ: '', contactRole: 'all', invStatus: 'all',
  drawer: null, drawerTab: 'deal', modal: null,
};
const save = () => store.set(STORE_KEY, db);
const savePrefs = () => store.set(PREF_KEY, prefs);

const artistById = id => db.artists.find(a => a.id === id);
const contactById = id => db.contacts.find(c => c.id === id);
const eventById = id => db.events.find(e => e.id === id);
const byDate = (a, b) => a.date.localeCompare(b.date);
const inFilter = ev => prefs.artist === 'all' || ev.artistId === prefs.artist;
const invStatus = inv => inv.status === 'sent' && inv.due < today() ? 'overdue' : inv.status;
const commissionOf = ev => (Number(ev.fee) || 0) * (Number(ev.commissionPct) || 0) / 100;
const live = ev => ev.status !== 'cancelled';
function conflictsFor(artistId, date, ignoreId) {
  return db.events.filter(e => e.id !== ignoreId && e.artistId === artistId && e.date === date && live(e));
}
function nextInvoiceNumber() {
  const yr = new Date().getFullYear();
  const nums = db.invoices.map(i => (i.number.match(new RegExp(`^GB-${yr}-(\\d+)$`)) || [])[1]).filter(Boolean).map(Number);
  return `GB-${yr}-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, '0')}`;
}

/* =========================================================
   Icons
   ========================================================= */
const ICON = {
  dashboard: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  shows: '<path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  artists: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/>',
  contacts: '<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7.5 17.5c.8-2 2.4-3 4.5-3s3.7 1 4.5 3"/>',
  finance: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v5M17.5 9.5v5"/>',
  data: '<ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>',
};
const svg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

const ROUTES = [
  { id: 'dashboard', label: 'Dashboard' },
  { id: 'calendar', label: 'Calendar' },
  { id: 'shows', label: 'Shows' },
  { id: 'artists', label: 'Artists' },
  { id: 'contacts', label: 'Contacts' },
  { id: 'finance', label: 'Finance' },
  { id: 'data', label: 'Data' },
];

/* =========================================================
   Shared fragments
   ========================================================= */
const pill = st => `<span class="pill ${st}">${esc(STATUS_LABEL[st] || st[0].toUpperCase() + st.slice(1))}</span>`;
const artistDot = a => `<span class="dot" style="background:${esc(a ? a.color : '#888')}"></span>`;
function datebox(date) {
  const d = parse(date);
  return `<div class="datebox"><div class="m">${MONTHS[d.getMonth()]}</div><div class="d">${d.getDate()}</div></div>`;
}
function gigRow(ev) {
  const a = artistById(ev.artistId);
  return `<li class="gig" data-act="open-event" data-id="${ev.id}" tabindex="0">
    ${datebox(ev.date)}
    <div style="min-width:0">
      <div class="who">${artistDot(a)}<span>${esc(a ? a.name : 'Unknown artist')}</span></div>
      <div class="where">${esc(ev.venue)}, ${esc(ev.city)} · ${esc(ev.title)}</div>
    </div>
    <div class="right">${pill(ev.status)}<span class="fee">${fmtMoney(ev.fee, ev.currency)}</span></div>
  </li>`;
}

/* =========================================================
   Views
   ========================================================= */
function viewDashboard() {
  const t = today();
  const evs = db.events.filter(inFilter);
  const upcoming = evs.filter(e => e.date >= t && live(e)).sort(byDate);
  const in90 = upcoming.filter(e => e.status === 'confirmed' && diffDays(t, e.date) <= 90);
  const options = upcoming.filter(e => e.status === 'option');
  const yr = String(new Date().getFullYear());
  const booked = evs.filter(e => e.status === 'confirmed' && e.date.startsWith(yr));
  const bookedEUR = booked.reduce((s, e) => s + toEUR(e.fee, e.currency), 0);
  const commEUR = booked.reduce((s, e) => s + toEUR(commissionOf(e), e.currency), 0);
  const evIds = new Set(evs.map(e => e.id));
  const openInv = db.invoices.filter(i => evIds.has(i.eventId) && ['sent', 'overdue'].includes(invStatus(i)));
  const overdue = openInv.filter(i => invStatus(i) === 'overdue');
  const openEUR = openInv.reduce((s, i) => s + toEUR(i.amount, i.currency), 0);

  // attention list
  const todo = [];
  options.forEach(e => {
    if (!e.optionExpires) return;
    const d = diffDays(t, e.optionExpires);
    if (d <= 14) todo.push({ sev: d <= 3 ? 'crit' : 'warn', sym: '!', ev: e, t: `Option ${d < 0 ? 'expired' : 'expires'}: ${artistById(e.artistId)?.name}`, s: `${e.venue}, ${e.city} on ${fmtShort(e.date)}`, when: relDays(d), sort: d });
  });
  overdue.forEach(i => {
    const e = eventById(i.eventId); if (!e) return;
    todo.push({ sev: 'crit', sym: '€', ev: e, t: `Invoice ${i.number} overdue`, s: `${fmtMoney(i.amount, i.currency)} from ${contactById(e.promoterId)?.company || e.venue}`, when: relDays(diffDays(t, i.due)), sort: diffDays(t, i.due) });
  });
  upcoming.filter(e => e.status === 'confirmed' && e.contract !== 'signed' && diffDays(t, e.date) <= 60).forEach(e => {
    todo.push({ sev: 'warn', sym: '§', ev: e, t: `Contract ${e.contract === 'sent' ? 'not returned' : 'not drafted'}`, s: `${artistById(e.artistId)?.name} at ${e.venue}, ${fmtShort(e.date)}`, when: relDays(diffDays(t, e.date)), sort: diffDays(t, e.date) });
  });
  upcoming.filter(e => e.status === 'confirmed' && !e.schedule.length && diffDays(t, e.date) <= 21).forEach(e => {
    todo.push({ sev: 'info', sym: '⏱', ev: e, t: 'Day sheet missing', s: `${artistById(e.artistId)?.name} at ${e.venue}, ${fmtShort(e.date)}`, when: relDays(diffDays(t, e.date)), sort: diffDays(t, e.date) + 5 });
  });
  todo.sort((a, b) => a.sort - b.sort);

  return `
  <section class="kpis" aria-label="Summary">
    <div class="kpi"><span class="label">Confirmed shows, next 90 days</span><span class="value">${in90.length}</span><span class="note">${upcoming.length} upcoming in total</span></div>
    <div class="kpi"><span class="label">Open options</span><span class="value">${options.length}</span><span class="note ${options.some(e => e.optionExpires && diffDays(t, e.optionExpires) <= 3) ? 'warn' : ''}">${options.filter(e => e.optionExpires && diffDays(t, e.optionExpires) <= 7).length} expire within a week</span></div>
    <div class="kpi"><span class="label">Gross booked ${yr}</span><span class="value">${fmtCompact(bookedEUR)}</span><span class="note">${fmtCompact(commEUR)} agency commission</span></div>
    <div class="kpi"><span class="label">Outstanding invoices</span><span class="value">${fmtCompact(openEUR)}</span><span class="note ${overdue.length ? 'warn' : ''}">${overdue.length} overdue</span></div>
  </section>
  <div class="grid-2">
    <div class="stack">
      <section class="panel">
        <div class="panel-head"><h2>Upcoming shows</h2><span class="sub">${upcoming.length ? `next ${Math.min(8, upcoming.length)}` : ''}</span><span class="spacer"></span><a class="btn sm ghost" href="#shows">All shows</a></div>
        ${upcoming.length ? `<ul class="gig-list">${upcoming.slice(0, 8).map(gigRow).join('')}</ul>` : `<div class="empty">Nothing on the books yet. Use <b>New show</b> to add a hold.</div>`}
      </section>
    </div>
    <div class="stack">
      <section class="panel">
        <div class="panel-head"><h2>Needs attention</h2><span class="sub">${todo.length} item${todo.length === 1 ? '' : 's'}</span></div>
        ${todo.length ? `<ul class="todo">${todo.slice(0, 8).map(x => `
          <li data-act="open-event" data-id="${x.ev.id}" tabindex="0">
            <span class="ico ${x.sev}" aria-hidden="true">${x.sym}</span>
            <div style="min-width:0"><div class="t">${esc(x.t)}</div><div class="s">${esc(x.s)}</div></div>
            <span class="when">${esc(x.when)}</span>
          </li>`).join('')}</ul>` : `<div class="empty">All clear. No expiring options, overdue invoices or unsigned contracts.</div>`}
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Booked fees by month</h2><span class="sub">approx. EUR, show date</span></div>
        ${monthChart(evs)}
      </section>
    </div>
  </div>`;
}

function monthChart(evs) {
  const start = new Date(); start.setDate(1);
  const months = Array.from({ length: 6 }, (_, i) => new Date(start.getFullYear(), start.getMonth() + i, 1));
  const data = months.map(m => {
    const key = `${m.getFullYear()}-${pad(m.getMonth() + 1)}`;
    const inM = evs.filter(e => e.date.startsWith(key));
    const c = inM.filter(e => e.status === 'confirmed').reduce((s, e) => s + toEUR(e.fee, e.currency), 0);
    const h = inM.filter(e => e.status === 'option' || e.status === 'pending').reduce((s, e) => s + toEUR(e.fee, e.currency), 0);
    return { m, c, h, nc: inM.filter(e => e.status === 'confirmed').length, nh: inM.filter(e => e.status === 'option' || e.status === 'pending').length };
  });
  const maxRaw = Math.max(1, ...data.map(d => d.c + d.h));
  const step = [1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000].find(s => maxRaw / s <= 4) || 100000;
  const max = Math.ceil(maxRaw / step) * step;
  const ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
  return `
  <div class="chart-legend"><span><i style="background:var(--accent)"></i>Confirmed</span><span><i style="background:var(--accent-tint)"></i>Option or pending</span></div>
  <div class="chart">
    <div class="bars" role="img" aria-label="Booked fees per month">
      ${ticks.map(v => `<div class="gridline" style="bottom:${v / max * 100}%"></div><div class="tick" style="top:${100 - v / max * 100}%">${fmtCompact(v)}</div>`).join('')}
      ${data.map(d => `
        <div class="bar-slot" data-tip="<b>${MONTHS_LONG[d.m.getMonth()]} ${d.m.getFullYear()}</b>Confirmed: ${fmtMoney(d.c)} (${d.nc})<br>Held: ${fmtMoney(d.h)} (${d.nh})">
          ${d.c + d.h > 0 ? `<span class="bar-val" style="bottom:${(d.c + d.h) / max * 100}%">${fmtCompact(d.c + d.h)}</span>` : ''}
          <div class="bar-stack">
            ${d.c > 0 ? `<div class="seg-c" style="height:${d.c / max * 180}px"></div>` : ''}
            ${d.h > 0 ? `<div class="seg-h" style="height:${Math.max(2, d.h / max * 180 - (d.c > 0 ? 2 : 0))}px"></div>` : ''}
          </div>
        </div>`).join('')}
    </div>
    <div class="bar-labels">${data.map(d => `<span>${MONTHS[d.m.getMonth()]}</span>`).join('')}</div>
  </div>`;
}

function viewCalendar() {
  const m = ui.month;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;
  const start = addDays(first, -offset);
  const last = new Date(m.getFullYear(), m.getMonth() + 1, 0);
  const cells = Math.ceil((offset + last.getDate()) / 7) * 7;
  const t = today();
  const evs = db.events.filter(inFilter);
  const byDay = {};
  evs.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  let html = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < cells; i++) {
    const d = addDays(start, i); const key = iso(d);
    const list = (byDay[key] || []).sort((a, b) => STATUSES.indexOf(b.status === 'cancelled' ? 'option' : b.status) - STATUSES.indexOf(a.status));
    html += `<div class="day ${d.getMonth() !== m.getMonth() ? 'out' : ''} ${key === t ? 'today' : ''}" data-act="new-event" data-date="${key}" title="Add a show on ${fmtDate(key)}">
      <span class="n">${d.getDate()}</span>
      ${list.map(e => { const a = artistById(e.artistId); return `<button type="button" class="chip ${e.status}" data-act="open-event" data-id="${e.id}" title="${esc(`${a?.name}: ${e.venue}, ${e.city} (${STATUS_LABEL[e.status]})`)}">${artistDot(a)}<span>${esc(a?.name || '?')} · ${esc(e.city)}</span></button>`; }).join('')}
    </div>`;
  }
  return `
  <div class="cal-head">
    <button type="button" class="btn sm" data-act="cal-move" data-n="-1" aria-label="Previous month">‹</button>
    <button type="button" class="btn sm" data-act="cal-move" data-n="1" aria-label="Next month">›</button>
    <span class="cal-title">${MONTHS_LONG[m.getMonth()]} ${m.getFullYear()}</span>
    <button type="button" class="btn sm ghost" data-act="cal-today">Today</button>
    <span class="spacer" style="flex:1"></span>
    <div class="legend-row">${STATUSES.map(pill).join('')}</div>
  </div>
  <div class="cal">${html}</div>
  <p class="infobox" style="margin:0">Click an empty part of a day to add a show on that date. Dashed chips are options that still need a decision.</p>`;
}

          </tr>`; }).join('') : `<tr><td colspan="8"><div class="empty">No shows match this filter.</div></td></tr>`}
        </tbody>

function viewFinance() {
  const evs = db.events.filter(inFilter);
  const evIds = new Set(evs.map(e => e.id));
  let invs = db.invoices.filter(i => evIds.has(i.eventId));
  const sum = arr => arr.reduce((s, i) => s + toEUR(i.amount, i.currency), 0);
  const paid = invs.filter(i => i.status === 'paid');
  const open = invs.filter(i => invStatus(i) === 'sent');
  const overdue = invs.filter(i => invStatus(i) === 'overdue');
  const draft = invs.filter(i => i.status === 'draft');
  const f = ui.invStatus;
  if (f !== 'all') invs = invs.filter(i => invStatus(i) === f);
  invs.sort((a, b) => b.issued.localeCompare(a.issued));
  const yr = String(new Date().getFullYear());
  const rows = db.artists.filter(a => prefs.artist === 'all' || a.id === prefs.artist).map(a => {
    const list = db.events.filter(e => e.artistId === a.id && e.status === 'confirmed' && e.date.startsWith(yr));
    const gross = list.reduce((s, e) => s + toEUR(e.fee, e.currency), 0);
    const comm = list.reduce((s, e) => s + toEUR(commissionOf(e), e.currency), 0);
    const recv = db.invoices.filter(i => i.status === 'paid' && list.some(e => e.id === i.eventId)).reduce((s, i) => s + toEUR(i.amount, i.currency), 0);
    return { a, n: list.length, gross, comm, recv };
  });
  const tot = rows.reduce((t, r) => ({ n: t.n + r.n, gross: t.gross + r.gross, comm: t.comm + r.comm, recv: t.recv + r.recv }), { n: 0, gross: 0, comm: 0, recv: 0 });
  const filters = [['all', 'All'], ['draft', 'Draft'], ['sent', 'Sent'], ['overdue', 'Overdue'], ['paid', 'Paid']];
  return `
  <section class="kpis">
    <div class="kpi"><span class="label">Received</span><span class="value">${fmtCompact(sum(paid))}</span><span class="note">${paid.length} invoices paid</span></div>
    <div class="kpi"><span class="label">Awaiting payment</span><span class="value">${fmtCompact(sum(open))}</span><span class="note">${open.length} sent</span></div>
    <div class="kpi"><span class="label">Overdue</span><span class="value">${fmtCompact(sum(overdue))}</span><span class="note ${overdue.length ? 'warn' : ''}">${overdue.length} past due date</span></div>
    <div class="kpi"><span class="label">Drafts</span><span class="value">${fmtCompact(sum(draft))}</span><span class="note">${draft.length} not yet sent</span></div>
  </section>
  <section class="panel">
    <div class="panel-head"><h2>Settlement by artist</h2><span class="sub">confirmed shows in ${yr}, approx. EUR</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Artist</th><th class="num">Shows</th><th class="num">Gross fees</th><th class="num">Commission</th><th class="num">Artist net</th><th class="num">Received</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><span style="display:inline-flex;align-items:center;gap:7px">${artistDot(r.a)}${esc(r.a.name)}</span></td><td class="num">${r.n}</td><td class="num">${fmtMoney(r.gross)}</td><td class="num">${fmtMoney(r.comm)}</td><td class="num">${fmtMoney(r.gross - r.comm)}</td><td class="num">${fmtMoney(r.recv)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="num">${tot.n}</td><td class="num">${fmtMoney(tot.gross)}</td><td class="num">${fmtMoney(tot.comm)}</td><td class="num">${fmtMoney(tot.gross - tot.comm)}</td><td class="num">${fmtMoney(tot.recv)}</td></tr></tfoot>
    </table></div>
  </section>
  <section class="panel">
    <div class="panel-head"><h2>Invoices</h2><span class="spacer"></span>
      <div class="seg" role="group" aria-label="Invoice filter">${filters.map(([k, l]) => `<button type="button" data-act="inv-filter" data-v="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Number</th><th>Show</th><th>Type</th><th class="hide-sm">Issued</th><th>Due</th><th>Status</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody>
      ${invs.length ? invs.map(i => { const e = eventById(i.eventId); const a = e && artistById(e.artistId); const st = invStatus(i); return `
        <tr>
          <td class="mono">${esc(i.number)}</td>
          <td><a href="#" data-act="open-event" data-id="${e?.id}" data-tab="money">${esc(a?.name || '?')}</a><span class="sub">${e ? `${esc(e.venue)}, ${fmtShort(e.date)}` : 'Show deleted'}</span></td>
          <td>${esc(i.kind)}</td>
          <td class="hide-sm mono">${fmtShort(i.issued)}</td>
          <td class="mono">${fmtShort(i.due)}</td>
          <td>${pill(st)}</td>
          <td class="num">${fmtMoney(i.amount, i.currency)}</td>
          <td style="white-space:nowrap;text-align:right">${invActions(i)}</td>
        </tr>`; }).join('') : `<tr><td colspan="8"><div class="empty">No invoices here.</div></td></tr>`}
      </tbody>
    </table></div>
  </section>`;
}
function invActions(i) {
  if (i.status === 'draft') return `<button type="button" class="btn sm" data-act="inv-set" data-id="${i.id}" data-v="sent">Mark sent</button>`;
  if (i.status === 'sent') return `<button type="button" class="btn sm" data-act="inv-set" data-id="${i.id}" data-v="paid">Mark paid</button>`;
  return `<button type="button" class="btn sm ghost" data-act="inv-set" data-id="${i.id}" data-v="sent">Undo paid</button>`;
}

  return `
  <div class="grid-2">
    <section class="panel">
      <div class="panel-head"><h2>Backup</h2><span class="sub">${db.events.length} shows · ${db.artists.length} artists · ${db.contacts.length} contacts · ${db.invoices.length} invoices</span></div>

    body = `

          <dt>Venue</dt><dd>${esc(ev.venue)}, ${esc(ev.city)}${ev.country ? `, ${esc(ev.country)}` : ''}</dd>
          <dt>Capacity</dt><dd class="mono">${Number(ev.capacity || 0).toLocaleString('en-GB')}</dd>
          <dt>Deposit</dt><dd>${ev.depositPct}% (${fmtMoney(ev.fee * ev.depositPct / 100, ev.currency)})</dd>

          <dt>Phone</dt><dd class="mono" style="font-size:13px">${esc(p.phone)}</dd>

      </div>

    body = `
      <div>
        <p class="section-label">Running order</p>
        ${ev.schedule.length ? `<ul class="sched">${ev.schedule.map((s, i) => `
          <li>
            <input type="time" value="${esc(s.time)}" data-sched="${i}" data-k="time" aria-label="Time">
            <input type="text" value="${esc(s.label)}" data-sched="${i}" data-k="label" aria-label="Item">
            <button type="button" class="btn sm ghost" data-act="sched-del" data-i="${i}" aria-label="Remove item">✕</button>
          </li>`).join('')}</ul>` : `<div class="infobox">No running order yet. Add items or start from a template.</div>`}
        <div class="filters" style="margin-top:10px">
          <button type="button" class="btn sm" data-act="sched-add">Add item</button>

      <label class="stack" style="gap:5px"><span class="section-label" style="margin:0">Travel</span>

      <label class="stack" style="gap:5px"><span class="section-label" style="margin:0">Accommodation</span>

    const total = invs.reduce((s, i) => s + Number(i.amount), 0);
    const paid = invs.filter(i => i.status === 'paid').reduce((s, i) => s + Number(i.amount), 0);
    body = `
      <div class="money-box">
        <div><span class="k">Invoiced</span><span class="v">${fmtMoney(total, ev.currency)}</span></div>

      ${invs.length ? `<div class="table-wrap panel"><table>
        <thead><tr><th>Number</th><th>Type</th><th>Due</th><th>Status</th><th class="num">Amount</th><th></th></tr></thead>

        ${total < ev.fee ? `<button type="button" class="btn sm" data-act="inv-gen" data-kind="Balance">Create balance invoice</button>` : ''}
      </div>
      ${ev.status !== 'confirmed' ? `<div class="infobox">Invoices usually go out once the show is confirmed.</div>` : ''}`;
  }
  return `
  <div class="scrim" data-act="close-drawer"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Show details">
    <div class="drawer-head">
      <div class="row">
        <div class="avatar" style="background:${esc(a?.color || '#888')};width:38px;height:38px;font-size:14px">${esc(initials(a?.name || '?'))}</div>
        <h2>${esc(a?.name || 'Unknown')} <span style="color:var(--muted)">@ ${esc(ev.city)}</span></h2>
        <button type="button" class="btn ghost sm" data-act="close-drawer" aria-label="Close">✕</button>
      </div>
      <div class="line2"><span class="mono">${fmtDate(ev.date)}</span><span>${esc(ev.venue)}</span><span>${esc(ev.title)}</span></div>
      <div class="status-flow" role="group" aria-label="Status">
        ${STATUSES.map(s => `<button type="button" class="${s}" data-act="set-status" data-v="${s}" aria-pressed="${ev.status === s}">${STATUS_LABEL[s]}</button>`).join('')}
      </div>
      <div class="tabs" role="tablist">
        ${[['deal', 'Deal'], ['sheet', 'Day sheet'], ['money', `Invoices${invs.length ? ` (${invs.length})` : ''}`]].map(([k, l]) => `<button type="button" role="tab" data-act="tab" data-v="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="drawer-body">${body}</div>
    <div class="drawer-foot">
      <button type="button" class="btn" data-act="edit-event" data-id="${ev.id}">Edit show</button>
      <button type="button" class="btn" data-act="dup-event" data-id="${ev.id}">Duplicate</button>
      <span style="flex:1"></span>
      <button type="button" class="btn danger" data-act="del-event" data-id="${ev.id}" data-confirm="Confirm delete">Delete</button>
    </div>
  </aside>`;
}

function daySheetText(ev) {
  const a = artistById(ev.artistId);
  const p = contactById(ev.promoterId);
  const L = [];
  L.push(`DAY SHEET: ${(a?.name || '').toUpperCase()}`);
  L.push(`${fmtDate(ev.date)}  |  ${ev.venue}, ${ev.city}${ev.country ? ', ' + ev.country : ''}`);
  L.push(`${ev.title}  |  cap. ${ev.capacity}`);
  L.push('');
  L.push('SCHEDULE');
  if (ev.schedule.length) ev.schedule.forEach(s => L.push(`  ${s.time || '--:--'}  ${s.label}`));
  else L.push('  TBC');
  L.push('');
  L.push('TRAVEL');
  L.push(`  ${ev.travel || 'TBC'}`);
  L.push('');
  L.push('ACCOMMODATION');
  L.push(`  ${ev.hotel || 'TBC'}`);
  L.push('');
  L.push('PROMOTER');
  L.push(p ? `  ${p.name}, ${p.company}\n  ${p.phone}  ${p.email}` : '  TBC');
  if (ev.notes) { L.push(''); L.push('NOTES'); L.push(`  ${ev.notes}`); }
  return L.join('\n');
}

function fieldHTML(f, v) {
  const id = `f-${f.name}`;
  const req = f.required ? 'required' : '';
  let input;
  if (f.type === 'select') {
    input = `<select class="field" id="${id}" name="${f.name}" ${req}>${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea class="field" id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
  } else {
    input = `<input class="field" id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${req} ${f.step ? `step="${f.step}"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} placeholder="${esc(f.placeholder || '')}">`;
  }
  return `<label class="${f.span ? 'span2' : ''}" ${f.showIf ? `data-showif="${f.showIf}"` : ''}>${esc(f.label)}${input}</label>`;
}
function renderModal() {
  const m = ui.modal;
  if (!m) return '';
  return `
  <div class="scrim" style="z-index:40" data-act="close-modal"></div>
  <div class="sheet-wrap" data-act="close-modal" data-self="1">
    <form class="sheet" id="modal-form" novalidate role="dialog" aria-modal="true" aria-label="${esc(m.title)}">
      <div class="sheet-head"><h2>${esc(m.title)}</h2><button type="button" class="btn ghost sm" data-act="close-modal" aria-label="Close">✕</button></div>
      <div class="sheet-body">
        ${m.pre || ''}
        ${m.fields.map(f => fieldHTML(f, m.values[f.name] ?? '')).join('')}
        <div id="form-error" class="warnbox span2" hidden></div>
      </div>
      <div class="sheet-foot">
        ${m.onDelete ? `<button type="button" class="btn danger left" data-act="modal-delete" data-confirm="Confirm delete">Delete</button>` : ''}
        <button type="button" class="btn ghost" data-act="close-modal">Cancel</button>
        <button type="submit" class="btn primary">${esc(m.submit || 'Save')}</button>
      </div>
    </form>
  </div>`;
}

function eventForm(ev, presetDate) {
  const isNew = !ev;
  const firstArtist = prefs.artist !== 'all' ? prefs.artist : db.artists[0]?.id;
  if (!db.artists.length) { toast('Add an artist first.'); go('artists'); return; }
  const a0 = artistById(ev?.artistId || firstArtist);
  const base = ev || {
    artistId: a0.id, date: presetDate || iso(addDays(new Date(), 30)), status: 'option', title: '', venue: '', city: '', country: '',
    promoterId: '', fee: a0.fee, currency: a0.currency, dealType: 'Flat fee', depositPct: 50, commissionPct: a0.commission,
    capacity: '', optionExpires: iso(addDays(new Date(), 14)), contract: 'none', notes: '',
  };
  ui.modal = {
    title: isNew ? 'New show' : 'Edit show',
    submit: isNew ? 'Add show' : 'Save changes',
    values: base,
    pre: `<div id="conflict" class="warnbox span2" hidden></div>`,
    fields: [
      { name: 'artistId', label: 'Artist', type: 'select', options: db.artists.map(a => [a.id, a.name]), required: true },
      { name: 'date', label: 'Show date', type: 'date', required: true },
      { name: 'status', label: 'Status', type: 'select', options: STATUSES.map(s => [s, STATUS_LABEL[s]]) },
      { name: 'optionExpires', label: 'Option expires', type: 'date', showIf: 'option' },
      { name: 'title', label: 'Event name', placeholder: 'e.g. Autumn tour, Club night', span: 1 },
      { name: 'venue', label: 'Venue', required: true },
      { name: 'city', label: 'City', required: true },
      { name: 'country', label: 'Country code', placeholder: 'DE' },
      { name: 'promoterId', label: 'Promoter', type: 'select', options: [['', 'None']].concat(db.contacts.slice().sort((x, y) => x.company.localeCompare(y.company)).map(c => [c.id, `${c.company} (${c.name})`])) },
      { name: 'capacity', label: 'Capacity', type: 'number', min: 0 },
      { name: 'fee', label: 'Fee', type: 'number', min: 0, step: 50, required: true },
      { name: 'currency', label: 'Currency', type: 'select', options: CURRENCIES },
      { name: 'dealType', label: 'Deal type', type: 'select', options: DEAL_TYPES },
      { name: 'depositPct', label: 'Deposit %', type: 'number', min: 0, max: 100 },
      { name: 'commissionPct', label: 'Agency commission %', type: 'number', min: 0, max: 100, step: 0.5 },
      { name: 'contract', label: 'Contract', type: 'select', options: Object.entries(CONTRACT) },
      { name: 'notes', label: 'Deal notes', type: 'textarea', span: 1, placeholder: 'Versus terms, riders, hospitality, radius clause' },
    ],
    onSave(v) {
      if (!v.venue || !v.city || !v.date) return 'Venue, city and date are required.';
      const clean = { ...v, fee: Number(v.fee) || 0, capacity: Number(v.capacity) || 0, depositPct: Number(v.depositPct) || 0, commissionPct: Number(v.commissionPct) || 0, country: v.country.toUpperCase() };
      if (clean.status !== 'option') clean.optionExpires = '';
      if (isNew) {
        const e = { id: uid(), schedule: [], hotel: '', travel: '', created: today(), ...clean };
        db.events.push(e);
        ui.drawer = e.id; ui.drawerTab = 'deal';
        toast(`Added ${artistById(e.artistId)?.name} at ${e.venue} on ${fmtShort(e.date)}.`);
      } else {
        Object.assign(ev, clean);
        toast('Show updated.');
      }
      save();
    },
  };
  render();
  updateConflict();
}

function artistForm(a) {
  const isNew = !a;
  ui.modal = {
    title: isNew ? 'Add artist' : 'Edit artist',
    values: a || { name: '', genre: '', base: '', color: ARTIST_COLORS[db.artists.length % ARTIST_COLORS.length], commission: 15, fee: 2500, currency: 'EUR', notes: '' },
    fields: [
      { name: 'name', label: 'Artist name', required: true },
      { name: 'genre', label: 'Genre / format', placeholder: 'e.g. Techno, live set' },
      { name: 'base', label: 'Home base', placeholder: 'City, country' },
      { name: 'color', label: 'Calendar colour', type: 'select', options: ARTIST_COLORS.map((c, i) => [c, ['Rust', 'Violet', 'Teal', 'Raspberry', 'Green', 'Orange', 'Blue', 'Purple'][i]]) },
      { name: 'fee', label: 'Asking fee', type: 'number', min: 0, step: 50 },
      { name: 'currency', label: 'Currency', type: 'select', options: CURRENCIES },
      { name: 'commission', label: 'Commission %', type: 'number', min: 0, max: 100, step: 0.5 },
      { name: 'notes', label: 'Tech and hospitality notes', type: 'textarea', span: 1 },
    ],
    onSave(v) {
      if (!v.name.trim()) return 'Give the artist a name.';
      const clean = { ...v, name: v.name.trim(), fee: Number(v.fee) || 0, commission: Number(v.commission) || 0 };
      if (isNew) { db.artists.push({ id: uid(), ...clean }); toast(`${clean.name} added to the roster.`); }
      else { Object.assign(a, clean); toast('Artist updated.'); }
      save();
    },
    onDelete: isNew ? null : () => {
      const n = db.events.filter(e => e.artistId === a.id).length;
      if (n) return `${a.name} still has ${n} show${n === 1 ? '' : 's'}. Delete or reassign them first.`;
      db.artists = db.artists.filter(x => x.id !== a.id);
      if (prefs.artist === a.id) { prefs.artist = 'all'; savePrefs(); }
      save(); toast('Artist removed.');
    },
  };
  render();
}

function contactForm(c) {
  const isNew = !c;
  ui.modal = {
    title: isNew ? 'Add contact' : 'Edit contact',
    values: c || { name: '', company: '', role: 'Promoter', email: '', phone: '', city: '', country: '', notes: '' },
    fields: [
      { name: 'company', label: 'Company / venue', required: true },
      { name: 'name', label: 'Contact name', required: true },
      { name: 'role', label: 'Role', type: 'select', options: ROLES },
      { name: 'email', label: 'Email', type: 'email' },
      { name: 'phone', label: 'Phone', type: 'tel' },
      { name: 'city', label: 'City' },
      { name: 'country', label: 'Country code' },
      { name: 'notes', label: 'Notes', type: 'textarea', span: 1 },
    ],
    onSave(v) {
      if (!v.company.trim() || !v.name.trim()) return 'Company and contact name are required.';
      const clean = { ...v, country: v.country.toUpperCase() };
      if (isNew) { db.contacts.push({ id: uid(), ...clean }); toast(`${clean.company} added.`); }
      else { Object.assign(c, clean); toast('Contact updated.'); }
      save();
    },
    onDelete: isNew ? null : () => {
      db.events.forEach(e => { if (e.promoterId === c.id) e.promoterId = ''; });
      db.contacts = db.contacts.filter(x => x.id !== c.id);
      save(); toast('Contact removed.');
    },
  };
  render();
}

function updateConflict() {
  const form = document.getElementById('modal-form');
  const box = document.getElementById('conflict');
  if (!form) return;
  const st = form.elements.status?.value;
  form.querySelectorAll('[data-showif]').forEach(el => { el.hidden = el.dataset.showif !== st; });
  if (!box) return;
  const editing = ui.modal?.values?.id;
  const list = st === 'cancelled' ? [] : conflictsFor(form.elements.artistId.value, form.elements.date.value, editing);
  box.hidden = !list.length;
  if (list.length) box.textContent = `Heads up: ${artistById(form.elements.artistId.value)?.name} already has ${list.map(e => `${e.venue}, ${e.city} (${STATUS_LABEL[e.status].toLowerCase()})`).join(' and ')} on this date.`;
}
